<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TVRI Bengkulu</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="screen">

        <!-- =====================================================
             PANEL KIRI
        ====================================================== -->

        <section class="left-panel">

            <!-- =================================================
                 LOGO TVRI BENGKULU
            ================================================== -->

            <header class="brand">

                <img
                    src="assets/logo-tvri-bengkulu.png"
                    alt="TVRI Bengkulu"
                    class="tvri-logo"
                >

            </header>


            <!-- =================================================
                 AREA AIR TERJUN
            ================================================== -->

            <div class="waterfall-area">

                <img
                    src="assets/pattern-background.png"
                    alt=""
                    class="pattern-background"
                >

                <img
                    src="assets/air-terjun.png"
                    alt="Air Terjun Bengkulu"
                    class="waterfall-image"
                >

            </div>


            <!-- =================================================
                 TANGGAL DAN JAM
            ================================================== -->

            <div class="date-row">

                <div class="date-label">
                    HARI, TANGGAL
                </div>

                <div class="clock">
                    14.33
                </div>

            </div>

        </section>



        <!-- =====================================================
             PANEL KANAN
        ====================================================== -->

        <section class="right-panel">


            <!-- =================================================
                 PATTERN KANAN
            ================================================== -->

            <img
                src="assets/pattern-right.png"
                alt=""
                class="pattern-right"
            >


            <!-- =================================================
                 KARTU BERITA
            ================================================== -->

            <div class="news-frame">

                <img
                    src="assets/berita.jpg"
                    alt="Berita TVRI Bengkulu"
                    class="news-image"
                >

            </div>

        </section>



        <!-- =====================================================
             PROGRAM BAR
        ====================================================== -->

        <section class="program-bar">


            <!-- =================================================
                 LIVE PNG
            ================================================== -->

            <div class="live-container">

                <img
                    src="assets/live.png"
                    alt="LIVE"
                    class="live-image"
                >

            </div>



            <!-- =================================================
                 WAKTU PROGRAM
            ================================================== -->

            <div class="time-column">

                <span class="time-small">
                    14.00
                </span>

                <strong>
                    15.00
                </strong>

                <span class="time-small">
                    16.00
                </span>

            </div>



            <!-- =================================================
                 JUDUL PROGRAM
            ================================================== -->

            <div class="program-column">

                <div class="program-small">
                    JUDUL PROGRAM
                </div>

                <div class="program-main">
                    JUDUL PROGRAM
                </div>

                <div class="program-small">
                    JUDUL PROGRAM
                </div>

            </div>



            <!-- =================================================
                 TEMA HARI INI
            ================================================== -->

            <div class="theme-column">

                <div class="theme-title">
                    TEMA HARI INI
                </div>

                <div class="theme-main">
                    PENGISI ACARA
                </div>

            </div>



            <!-- =================================================
                 AREA KOSONG
            ================================================== -->

            <div class="program-empty"></div>



            <!-- =================================================
                 PATTERN BAWAH KANAN
            ================================================== -->

            <img
                src="assets/pattern-right.png"
                alt=""
                class="bottom-pattern"
            >

        </section>

    </main>


</body>

</html>
